# CI: проверки бэкенда (be/), ML-сервиса (ml/) и фронтенда (fe/) на каждый PR в main
# и после каждого слияния в main.
# В PR каждая часть проверяется, только если изменились её файлы (job changes).
# После слияния в main и при ручном запуске проверяются все три части: так main
# всегда проверен целиком, а кэш pip/npm, созданный на main, доступен всем PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Ручной запуск во вкладке Actions — проверяет все три части
  workflow_dispatch:

# Новый push в тот же PR отменяет ещё не закончившийся прогон.
# Прогоны на main не отменяются: каждое слияние должно быть проверено
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # нужно dorny/paths-filter, чтобы узнать список файлов PR

jobs:
  changes:
    name: Какие папки изменились
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      ml: ${{ steps.filter.outputs.ml }}
      fe: ${{ steps.filter.outputs.fe }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            be:
              - 'be/**'
              - '.github/workflows/ci.yml'
            ml:
              - 'ml/**'
              - '.github/workflows/ci.yml'
            fe:
              - 'fe/**'
              - '.github/workflows/ci.yml'

  be:
    name: be — ruff и pytest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    # Временная PostgreSQL + pgvector для тестов миграций и изоляции организаций
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: reo
          POSTGRES_DB: reo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:reo@localhost:5432/reo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: be/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  ml:
    name: ml — ruff и pytest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  fe:
    name: fe — lint, тесты и сборка
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: fe/.nvmrc
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
