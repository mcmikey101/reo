[project]
name = "reo-ml"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# Корень импортов — ml/ (как в Dockerfile: uvicorn api.main:app)
pythonpath = ["."]
testpaths = ["tests"]
